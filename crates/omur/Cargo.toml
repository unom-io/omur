[package]
name = "omur"
description = "AC-3 and E-AC-3 (ATSC A/52) audio encoder in safe Rust, for real-time threads"
keywords = ["ac3", "eac3", "audio", "codec", "encoder"]
categories = ["multimedia::audio", "multimedia::encoding"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Object audio (TS 103 420). Off by default; no tag that contains src/joc is published
# before its release gate clears (docs/design.md §12).
joc = []

[lints]
workspace = true

[dependencies]

[dev-dependencies]
oxideav-ac3.workspace = true
oxideav-core.workspace = true
# Counts allocations for tests/realtime.rs; implementing GlobalAlloc ourselves needs `unsafe`.
stats_alloc = "=0.1.10"

# A counting global allocator needs the binary to itself.
[[test]]
name = "realtime"
harness = false
