# The quality gate: generates the 5.1 test signal, encodes it with omur or one of the two
# reference encoders, and scores an ffmpeg decode per channel (docs/design.md §9).
[package]
name = "omur-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "probe"
path = "src/main.rs"

[lints]
workspace = true

# One encoder per build: `--no-default-features --features omur` encodes with omur, `--features
# vuio` with the fork. The fork declares rustc 1.98; it builds on 1.96 with
# `--ignore-rust-version`.
[features]
default = ["oxideav"]
oxideav = ["dep:oxideav-ac3", "dep:oxideav-core"]
vuio = ["dep:vuio-codec-ac3", "dep:vuio-codec-core"]
omur = ["dep:omur"]

[dependencies]
omur = { workspace = true, optional = true }
oxideav-ac3 = { workspace = true, optional = true }
oxideav-core = { workspace = true, optional = true }
vuio-codec-ac3 = { version = "=0.0.1", optional = true }
vuio-codec-core = { version = "=0.0.1", optional = true }
