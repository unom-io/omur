# A `v*` tag publishes the library. Only `omur` goes to crates.io: the probe is `publish =
# false`, and object audio stays unpublished until its release gate clears (docs/design.md §12).
name: release
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - run: cargo publish -p omur --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
