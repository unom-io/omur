name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The acceptance gate decodes with ffmpeg; tests that need it skip when it is absent.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo clippy -p omur --all-targets --features joc -- -D warnings
      - run: cargo test -p omur --features joc

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      # A minute per target from the checked-in seeds; a crash exits non-zero.
      - run: |
          for t in encode chunking api; do
            mkdir -p fuzz/corpus/$t
            cargo +nightly fuzz run $t fuzz/corpus/$t fuzz/seeds/$t -- -max_total_time=60
          done
